name: CI

# Runs on every push and pull request. Gates: tests must pass and the
# production build must succeed before code reaches Vercel. Inspired by the
# ECC "GateGuard" idea — never ship code that doesn't build.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Lint is advisory (the repo has known non-blocking react-hooks
      # advisories); it never fails the build.
      - name: Lint (advisory)
        run: npm run lint || true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: bash scripts/secret-scan.sh
